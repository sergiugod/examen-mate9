function paginate(container, o) {

  let pageNo = 0; const pages = [];
  const newPage = () => { pageNo++; const pg = document.createElement('div'); pg.className = 'sheet'; pg.innerHTML = `${pageNo === 1 ? o.head() : ''}<div class="cols c${o.cols}"></div><div class="sfoot"></div>`; container.appendChild(pg); pages.push(pg); return pg; };
  let pg = newPage(), cols = $('.cols', pg);
  const addEl = html => { const d = document.createElement('div'); d.innerHTML = html; const el = d.firstElementChild; cols.appendChild(el); return el; };
  for (let i = 0; i < o.main.length; i++) {
    let el = addEl(o.main[i].html);
    if (overflowing(cols)) { cols.removeChild(el); if (cols.children.length === 0) { cols.appendChild(el); continue; } pg = newPage(); cols = $('.cols', pg); el = addEl(o.main[i].html); }
  }
  if (o.extra) {
    let divEl = o.divider ? addEl(o.divider) : null;
    if (divEl && overflowing(cols)) { cols.removeChild(divEl); divEl = null; o.extra = null; }
    let guard = 0;
    while (o.extra && guard++ < 80) {
      const nx = o.extra(); if (!nx) break; const el = addEl(nx.html);
      if (overflowing(cols)) { cols.removeChild(el); o.rollback && o.rollback(); break; }
    }
    if (divEl && cols.lastElementChild === divEl) cols.removeChild(divEl);
  }
  pages.forEach(p => { const c = $('.cols', p); let g = 0; while (overflowing(c) && c.children.length > 1 && g++ < 5) { c.removeChild(c.lastElementChild); o.rollback && o.extra && o.rollback(); } });
  pages.forEach((p, k) => { $('.sfoot', p).innerHTML = o.foot(k + 1, pages.length); });
  return pages;
}

  else if (a === 'ptpdf') { openPdf({ kind: 'past', fixed: PS.test.tasks, base: randCode(), key: S.teacher }); }
  else if (a === 'pnewtest') { pNewTest(); render(); }
  else if (a === 'ptsubmit') { pSubmitTest(); render(); window.scrollTo && window.scrollTo(0, 0); }
  else if (a === 'lang') { S.lang = b.dataset.v; try { localStorage.setItem('mpf-lang', S.lang); } catch (x) {} render(); }
  else if (a === 'teacher') { S.teacher ? (S.teacher = false, sessionStorage.removeItem('mpf-teacher'), render()) : askPassword(); }
  else if (a === 'teacher-off') { S.teacher = false; try { sessionStorage.removeItem('mpf-teacher'); } catch (x) {} render(); }
  else if (a === 'go') { S.view = b.dataset.v; if (S.view === 'practice' && !S.pr) { newPractice(0); say(MSG.hello); } render(); }
  else if (a === 'check') prCheck();
  else if (a === 'hint') { S.pr.hint = true; say(MSG.hint); render(); }
  else if (a === 'sol') { S.pr.showSol = !S.pr.showSol; render(); }
  else if (a === 'next') nextAndRender();
  else if (a === 'opt') { const vals = curVals(); const i = +b.dataset.p, j = +b.dataset.f; (vals[i] = vals[i] || [])[j] = b.dataset.v; render(); }
  else if (a === 'key') {
    const inp = S.lastInput && document.body.contains(S.lastInput) ? S.lastInput : $('input.ans:not([readonly])'); if (!inp) return;
    inp.focus(); const k = b.dataset.k; let s = inp.selectionStart == null ? inp.value.length : inp.selectionStart, en = inp.selectionEnd == null ? s : inp.selectionEnd;
    if (k === '⌫') { if (s === en && s > 0) s--; inp.value = inp.value.slice(0, s) + inp.value.slice(en); } else { inp.value = inp.value.slice(0, s) + k + inp.value.slice(en); s += k.length; }
    inp.setSelectionRange(s, s); inp.dispatchEvent(new Event('input', { bubbles: true }));
  }
  else if (a === 'tstart') { newTest(); say(MSG.hello); render(); }
  else if (a === 'tcheck') { const c = ($('#chkcode').value || '').trim().toUpperCase(); if (c) { S.check = { code: c, probs: makeSet(ITEM(), c, 't', 10) }; render(); } }
  else if (a === 'echeck') { const c = ($('#chkcode').value || '').trim().toUpperCase(); if (c) { const its = examItems(); S.check = { code: c, nums: its, probs: its.map(n => makeProblem(ITEMS[n], RNG(`${c}|exam|${n}`), 'exam')) }; render(); } }
  else if (a === 'chkclear') { S.check = null; render(); }
  else if (a === 'tload') { const c = ($('#codein').value || '').trim(); if (c) { newTest(c); render(); } }
  else if (a === 'tsubmit') tSubmit();
  else if (a === 'tnew') { newTest(); S.say = null; render(); window.scrollTo(0, 0); }
  else if (a === 'tpdfnew') { const c = (($('#codein') || {}).value || '').trim().toUpperCase() || randCode(); openPdf({ kind: 'item', n: PAGE.n, count: 1, base: c, exact: true, key: S.teacher }); }
  else if (a === 'epdfnew') { const c = (($('#codein') || {}).value || '').trim().toUpperCase() || randCode(); openPdf({ kind: 'exam', base: c, key: S.teacher }); }
  else if (a === 'tpdf') openPdf({ kind: 'item', n: PAGE.n, count: 1, base: S.test.code, exact: true, key: S.teacher });
  else if (a === 'estart') { newExam(); startClock(); say(MSG.hello); render(); }
  else if (a === 'eload') { const c = ($('#codein').value || '').trim(); if (c) { newExam(c); startClock(); render(); } }
  else if (a === 'esubmit') eSubmit(false);
  else if (a === 'enew') { S.exam = null; render(); }
  else if (a === 'epdf') openPdf({ kind: 'exam', base: S.exam.code, key: S.teacher });
  else if (a === 'pdfgo') openPdf({ kind: 'item', n: PAGE.n, count: +$('#pdfN').value, base: ($('#pdfCode').value || randCode()).toUpperCase(), key: S.teacher && $('#pdfKey').checked });
});
document.addEventListener('input', e => { const el = e.target; if (el.matches && el.matches('input.pin') && PS.test) { PS.test.vals[+el.dataset.pi] = el.value; } });
document.addEventListener('change', e => { const el = e.target; if (!el.dataset || !el.dataset.pf) return; const v = el.value; if (el.id === 'pcount') { PS.pcount = +v; return; } if (el.id === 'pf-item') PS.item = +v; else if (el.id === 'pf-lab') PS.lab = v; else PS.year = v; PS.cur = null; PS.vset = null; render(); });
document.addEventListener('DOMContentLoaded', () => { document.title = (PAGE.kind === 'past' ? 'Din examenele anterioare' : PAGE.kind === 'exam' ? 'Test complet' : 'Item ' + PAGE.n) + ' · Mate pentru fiecare'; render(); });
