<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate pentru fiecare · Pregătire pentru examen</title>
<style>
:root{
  --bg:#f5f7fb;--bg2:#e9eef9;--surface:#ffffff;--ink:#0f1b33;--muted:#5b6780;--line:#dde4f0;
  --brand:#2f5bff;--brand2:#12b5a6;--accent:#ff8a3d;--ring:rgba(47,91,255,.28);
  --shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1220;--bg2:#101a30;--surface:#131e36;--ink:#eef2fb;--muted:#9aa8c4;--line:#22304f;
  --brand:#7a96ff;--brand2:#3ad1c2;--accent:#ffa566;--ring:rgba(122,150,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 60%),
  radial-gradient(700px 420px at -5% 10%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 60%),var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;font-family:"Cambria","DejaVu Serif",Georgia,serif;color:var(--brand);opacity:.11;user-select:none;animation:drift linear infinite;will-change:transform}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}100%{transform:translate(0,0) rotate(0)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* bara de sus */
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
nav.stuck{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(15,27,51,.08)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font:700 19px Georgia,serif;font-style:normal;box-shadow:0 6px 16px var(--ring)}
.logo span small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem inherit;font-family:inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.cta:focus-visible,.card:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"main msg" "cta msg";column-gap:36px;row-gap:6px;align-items:center;padding:30px 32px;margin-top:6px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-main{grid-area:main}.msg{grid-area:msg}.cta-wrap{grid-area:cta}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.eyebrow:before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}
h1{font-size:clamp(1.9rem,5.2vw,3.3rem);line-height:1.07;letter-spacing:-.03em;margin:12px 0 14px;font-weight:800;overflow-wrap:anywhere}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.6;color:var(--muted);margin:0 0 18px}
/* mesajul de încurajare: card compact, text mare, navigare cu săgeți */
.msg{position:relative;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;padding:16px 18px 14px 22px;border-radius:20px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand2) 88%,#000));box-shadow:0 12px 30px var(--ring)}
.msg:before{content:"“";position:absolute;right:14px;top:-26px;font:700 130px/1 Georgia,serif;color:rgba(255,255,255,.15);pointer-events:none}
.msg small{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.msg p{margin:0;font-size:clamp(1.45rem,3.8vw,2.2rem);line-height:1.2;font-weight:800;letter-spacing:-.02em;transition:opacity .3s,transform .3s;min-height:3.6em;display:flex;align-items:center}
.msg p.out{opacity:0;transform:translateY(6px)}
.msgnav{display:flex;align-items:center;gap:10px}
.msgnav button{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;transition:background .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.msgnav button:hover{background:rgba(255,255,255,.34)}.msgnav button:active{transform:scale(.94)}
.msgnav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;padding:12px 20px;font:700 .95rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.cta.p{background:var(--brand);color:#fff;box-shadow:0 8px 20px var(--ring)}
.cta.s{background:var(--surface);color:var(--ink);border-color:var(--line)}
.cta:hover{transform:translateY(-2px)}
.cta.off{opacity:.5;pointer-events:none}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;grid-template-areas:"main" "msg" "cta";row-gap:18px;padding:22px 18px}
}
/* secțiuni */
h2{display:flex;align-items:center;gap:14px;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:38px 0 14px;font-weight:700}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s}
a.card:hover,.card.lk:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 30px var(--ring)}
.card .no{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.card h3{font-size:1rem;line-height:1.3;margin:2px 0 0;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.tags span{font-size:.7rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.card a.stretch{position:absolute;inset:0;border-radius:18px;z-index:1}
.card .th{position:relative;z-index:2;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);border-radius:999px;padding:5px 11px;text-decoration:none;margin-top:6px}
.card .th:hover{background:color-mix(in srgb,var(--brand) 20%,transparent)}
.card .th.off{color:var(--muted);background:var(--bg2);pointer-events:none;font-weight:600}
.card .go{position:absolute;right:16px;top:16px;color:var(--muted);transition:transform .18s,color .18s}
a.card:hover .go,.card.lk:hover .go{transform:translateX(3px);color:var(--brand)}
.card.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand2) 85%,#000));color:#fff;border-color:transparent}
.card.hl p,.card.hl .go{color:rgba(255,255,255,.82)}
.card.hl .no{background:rgba(255,255,255,.18);color:#fff}
.card.hl .tags span{color:#fff;border-color:rgba(255,255,255,.4)}
.card.off{opacity:.55;filter:saturate(.6)}
.card.off:after{content:attr(data-soon);position:absolute;right:14px;top:14px;font-size:.68rem;font-weight:700;background:var(--bg2);color:var(--muted);border-radius:999px;padding:2px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:14px}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap;margin:22px 0 0;color:var(--muted);font-size:.88rem}
.stats b{display:block;font-size:1.5rem;color:var(--ink);letter-spacing:-.02em}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--brand)}
@media(max-width:520px){.hero{padding:18px 14px;border-radius:22px}nav{padding:10px 14px;margin:0 -16px}.logo span small{display:none}.card{padding:16px}.cta{flex:1 1 100%}.seg button{padding:8px 12px}.card .th{padding:9px 14px;font-size:.85rem}.stats b{font-size:1.25rem}footer{flex-direction:column}}
@media(hover:none){a.card:hover,.card.lk:hover{transform:none}.cta:hover{transform:none}}
</style></head>

      </div>
    </aside>
    <div class="cta-wrap">
      <div class="ctas" id="ctas"></div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <h2 id="sec1"></h2>
  <div class="big" id="special"></div>

  <h2 id="sec2"></h2>
  <div class="grid" id="items"></div>

  <footer>
    <span>© 2026 Godovaniuc Ana</span>
    <span><span id="lic"></span> <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></span>

</div>

function card(url,no,title,desc,tags,hl,theoryUrl,showTheory){

  el.innerHTML='<div class="no">'+no+'</div><h3>'+title+'</h3>'+(desc?'<p>'+desc+'</p>':'')+'<div class="tags">'+tags.map(function(t){return '<span>'+t+'</span>'}).join('')+'</div>'+(url?ARROW:'');

}
