<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test complet · Mate pentru fiecare</title>

<style>:root{
  --bg:#f5f7fb;--bg2:#e9eef9;--surface:#ffffff;--ink:#0f1b33;--muted:#5b6780;--line:#dde4f0;
  --brand:#2f5bff;--brand2:#12b5a6;--accent:#ff8a3d;--ring:rgba(47,91,255,.28);
  --ok:#16a34a;--okbg:#e8f7ee;--bad:#e11d48;--badbg:#fdecef;--warn:#f59e0b;--warnbg:#fff6e0;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
  --fig:#1d2f4f;--figbad:#d6336c;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1220;--bg2:#101a30;--surface:#131e36;--ink:#eef2fb;--muted:#9aa8c4;--line:#22304f;
  --brand:#7a96ff;--brand2:#3ad1c2;--accent:#ffa566;--ring:rgba(122,150,255,.35);
  --ok:#4ade80;--okbg:#10301f;--bad:#fb7185;--badbg:#3a1520;--warn:#fbbf24;--warnbg:#33290d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--fig:#dbe4ff;--figbad:#ff8fb1;}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;color:var(--ink);
background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 60%),radial-gradient(700px 420px at -5% 10%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 60%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.board{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font:700 19px Georgia,serif;box-shadow:0 6px 16px var(--ring);text-decoration:none}
.brand b{font-size:1rem;display:block;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.72rem}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.chip{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:600 .78rem inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.teach{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.chip.teach.on{background:var(--warn);color:#2b1d00;border-color:var(--warn)}
.chip:focus-visible,.btn:focus-visible,.tab:focus-visible,.gcard:focus-visible,.opt:focus-visible,.lv:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.paper{--sq:color-mix(in srgb,var(--brand) 13%,transparent);position:relative;background-color:color-mix(in srgb,var(--surface) 38%,transparent);background-image:linear-gradient(var(--sq) 1px,transparent 1px),linear-gradient(90deg,var(--sq) 1px,transparent 1px);background-size:24px 24px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;box-shadow:none;padding:22px 24px 26px 56px;margin-top:16px;min-height:420px}
.paper:before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--bad);opacity:.35}
@media(max-width:720px){.paper{padding:16px 12px 20px 34px}.paper:before{left:22px}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:4px;background:var(--bg2);border-radius:14px;width:fit-content;max-width:100%}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font:600 .88rem inherit;font-family:inherit}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
h1.t,h2.t{color:var(--ink);margin:2px 0 8px;letter-spacing:-.025em;font-weight:800}
h1.t{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.1}h2.t{font-size:1.35rem}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin:14px 0}
.gcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .18s,border-color .18s,box-shadow .18s;box-shadow:var(--shadow)}
.gcard:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 30px var(--ring)}
.gcard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--brand) 12%,transparent)}
.gcard b{display:block;font-size:1.02rem;letter-spacing:-.01em}
.gcard span{color:var(--muted);font-size:.88rem;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--brand);color:#fff;border:1px solid transparent;border-radius:12px;padding:10px 18px;font:700 .92rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px var(--ring);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.warn{background:var(--accent);color:#2b1400;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{display:inline-block;margin:0 6px 6px 0;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}
.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lv{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font:600 .82rem inherit;font-family:inherit;color:var(--muted)}
.lv.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{display:block}
@media(max-width:720px){.stage{grid-template-columns:1fr}.paper{padding:16px 14px 20px;border-radius:18px}}
.mascot{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:84px}
.mascot .owl{width:90px;height:100px}
.bubble{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:8px 10px;font-size:.82rem;text-align:center;position:relative;line-height:1.3;color:var(--ink)}
.bubble:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line);border-bottom:0}
@media(max-width:720px){.mascot{flex-direction:row;position:static}.mascot .owl{width:56px;height:62px}.bubble:after{display:none}}
.owl.bounce{animation:bounce .6s}.owl.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.prob{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.prob.okp{border-color:var(--ok)}.prob.badp{border-color:var(--bad)}
.pnum{flex:0 0 32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center}
.pbody{flex:1;min-width:0}
.ptext{line-height:1.6;font-size:1.02rem}
.pfig{margin:8px 0;max-width:300px}
.pfig svg,svg.fig{width:100%;height:auto;display:block}
.pfields{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;align-items:center}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:1.02rem}
.fld .flab{white-space:nowrap}
input.ans{width:104px;border:1px solid var(--line);border-bottom:3px solid var(--brand);background:var(--bg);color:var(--ink);font:700 1.05rem inherit;font-family:inherit;padding:6px 8px;border-radius:8px;outline:0}
input.ans:focus{box-shadow:0 0 0 3px var(--ring)}
input.ans.ok{border-color:var(--ok);background:var(--okbg)}
input.ans.bad{border-color:var(--bad);background:var(--badbg)}
.mark{font-weight:800;font-size:1.2rem}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.opts{display:inline-flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;font:600 .9rem inherit;font-family:inherit}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--ink)}
.unit{color:var(--muted)}
.fb{margin-top:10px;color:var(--bad);font-size:.95rem;line-height:1.5;font-weight:600}
.fb.good{color:var(--ok)}
.sol{margin-top:10px;background:var(--warnbg);border-left:4px solid var(--warn);border-radius:10px;padding:10px 14px;line-height:1.75}
.key{margin-top:10px;background:color-mix(in srgb,var(--brand) 10%,transparent);border-left:4px solid var(--brand);border-radius:10px;padding:8px 14px;font-size:.93rem}
.hintbox{margin-top:10px;background:var(--okbg);border-left:4px solid var(--ok);border-radius:10px;padding:8px 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.keypad{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;padding:8px;background:var(--bg2);border-radius:12px}
.keypad button{min-width:40px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:1.02rem;cursor:pointer;font-family:inherit}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.12;font-size:.95em}
.fr>i{font-style:normal;padding:0 .2em}.fr>i:first-child{border-bottom:1.5px solid currentColor}
.sq{white-space:nowrap}.sq .ov{border-top:1.5px solid currentColor;padding:0 1px}
sup{font-size:.7em;line-height:0}sub{font-size:.7em;line-height:0}
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;text-align:center;box-shadow:var(--shadow)}
.big{font:800 2.6rem inherit;font-family:inherit;letter-spacing:-.03em;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.badge{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:.88rem;font-weight:700}
.timer{position:sticky;top:64px;z-index:5;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand2) 88%,#000));color:#fff;border-radius:14px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;box-shadow:0 8px 20px var(--ring)}
.timer .t{font:700 1.3rem "DejaVu Sans Mono",monospace}.timer.low{background:#be123c}
.itemhead{display:flex;align-items:center;gap:12px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.itemhead:after{content:"";flex:1;height:1px;background:var(--line)}
table.rt{border-collapse:collapse;width:100%;background:var(--surface)}
table.rt td,table.rt th{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.rt th{background:var(--bg2)}
footer.lic{color:var(--muted);text-align:center;font-size:.8rem;padding:16px 6px 0}
footer.lic a{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal input[type=text],.modal input[type=password],.modal input[type=number],.modal select,.codein,#pdfCode,#pdfN,#codein{width:100%;padding:9px 11px;font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;margin:4px 0 10px;background:var(--bg);color:var(--ink)}
.codein,#codein{width:auto;margin:0}
.modal label{font-weight:700;font-size:.9rem}
.confetti{position:fixed;top:-20px;font-size:1.4rem;pointer-events:none;z-index:60;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:70;font-size:.9rem}
.teachbar{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:.9rem;font-weight:700}
.exbox{max-width:760px}.exh{font-weight:800;color:var(--brand);margin:16px 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.exsol{margin:0}.exrule{background:color-mix(in srgb,var(--brand2) 12%,transparent);border-left:4px solid var(--brand2);padding:10px 14px;border-radius:10px;line-height:1.55}
.codehelp{font-size:.85rem;margin:4px 0 0}
.tab{text-decoration:none;display:inline-block;font-size:.88rem;font-weight:600;font-family:inherit}
.theory{max-width:780px}.theory h3{margin:20px 0 6px;font-size:1.02rem;color:var(--brand);letter-spacing:-.01em}
.theory p,.theory li{line-height:1.65}.theory ul{padding-left:20px;margin:6px 0}
.theory .box{background:color-mix(in srgb,var(--brand) 8%,transparent);border-left:4px solid var(--brand);border-radius:10px;padding:8px 14px;margin:8px 0}
.theory .ex{background:var(--warnbg);border-left:4px solid var(--warn);border-radius:10px;padding:8px 14px;margin:8px 0}
.theory table{border-collapse:collapse;margin:8px 0}.theory td,.theory th{border:1px solid var(--line);padding:5px 10px}
/* ---- desen geometric ---- */
svg.fig .gl{stroke:var(--fig);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.fig .gl.hl{stroke:var(--figbad);stroke-width:2.2}
svg.fig .gl.thin{stroke:var(--muted);stroke-width:1}
svg.fig .gl.lineA{stroke:var(--fig)}
svg.fig .gd{fill:var(--fig)}
svg.fig .glab{font:italic 700 14px "Cambria","DejaVu Serif",serif;fill:var(--fig)}
svg.fig .gtxt{font:12px "DejaVu Sans",sans-serif;fill:var(--muted)}
svg.fig .ga{stroke:var(--figbad);stroke-width:1.5;fill:none}
svg.fig .gang{font:700 11px "DejaVu Sans",sans-serif;fill:var(--figbad)}
/* ---- fișa PDF ---- */
#pdfOverlay{position:fixed;inset:0;background:#6b7280;z-index:80;overflow:auto}
#pdfOverlay[hidden]{display:none}
.pbar{position:sticky;top:0;z-index:2;background:#263238;color:#fff;display:flex;gap:8px;padding:8px 12px;align-items:center;flex-wrap:wrap}
.sheets{padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet{box-sizing:border-box;width:210mm;height:297mm;padding:12mm;flex:none;background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;font-family:"Liberation Serif","Times New Roman","DejaVu Serif",serif;font-size:11.5pt}
.sheet .shead{border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:3mm}
.sheet .shead .t1{font-weight:700;font-size:13.5pt}
.sheet .shead .t2{font-size:10.5pt;display:flex;justify-content:space-between;margin-top:.5mm}
.sheet .shead .scoreln{margin-top:1mm}.pex .ppt{font-size:.85em;white-space:nowrap;font-weight:700}
.sheet .shead .t3{margin-top:2.5mm;font-size:10.5pt;display:flex;gap:6mm}
.sheet .shead .t3 span{flex:1;border-bottom:1px solid #000;white-space:nowrap}
.sheet .cols{flex:1;min-height:0;column-gap:8mm;column-fill:auto;overflow:hidden}
.sheet .cols.c1{column-count:1}.sheet .cols.c2{column-count:2}.sheet .cols.c3{column-count:3}
.sheet .sfoot{border-top:.8px solid #555;margin-top:2mm;padding-top:1mm;font-size:8pt;color:#333;display:flex;justify-content:space-between}
.pex{break-inside:avoid;page-break-inside:avoid;display:flex;gap:2mm;margin:0 0 3.2mm;line-height:1.4}
.pex .pn{flex:0 0 6mm;font-weight:700}
.pex .pc{flex:1;min-width:0}
.pex .pbot{display:flex;flex-wrap:wrap;gap:1mm 3mm;align-items:flex-end;justify-content:space-between}.pex .pf{flex:0 0 40mm;margin:1mm 0 0 auto}.pex .pa>span{white-space:nowrap}.pex .pa>span.pch{white-space:normal;display:block;flex:1 0 100%}.pex .pco{display:block;margin-top:.6mm}
.pex .pf svg{width:100%;height:auto}
.pex .pa{flex:1 1 auto;margin-top:1.2mm;display:flex;flex-wrap:wrap;gap:1mm 5mm;align-items:baseline}
.pex .bl{display:inline-block;min-width:17mm;border-bottom:1px solid #000;height:1.15em;vertical-align:baseline}
.pdiv{break-inside:avoid;font-weight:700;border-bottom:1px dashed #000;margin:1mm 0 3mm;padding-bottom:.6mm;font-size:11pt;letter-spacing:.3px}
.krow{break-inside:avoid;margin:0 0 1.6mm;line-height:1.35;font-size:10.5pt}
.sheet .fr{font-size:.95em}
.sheet svg.fig .gl{stroke:#000}.sheet svg.fig .gl.hl{stroke:#000;stroke-width:2.2}.sheet svg.fig .ga,.sheet svg.fig .gang{stroke:#000;fill:none}.sheet svg.fig .gang{fill:#000;stroke:none}.sheet svg.fig .glab,.sheet svg.fig .gd{fill:#000}
@media print{
  @page{size:A4;margin:12mm}
  body.printing{background:#fff!important}
  body.printing .board,body.printing .modal,body.printing .toast,body.printing .confetti{display:none!important}
  body.printing #pdfOverlay{position:static!important;background:#fff!important;overflow:visible!important;display:block!important}
  body.printing .pbar{display:none!important}
  body.printing .sheets{display:block!important;padding:0!important;zoom:1!important}
  body.printing .sheet{box-shadow:none!important;margin:0!important;padding:0!important;break-after:page;page-break-after:always;width:186mm;height:271mm}
  body.printing .sheet:last-child{break-after:auto;page-break-after:auto}
}

.teachbox{margin-top:18px;padding:12px 14px;border:1px solid var(--warn);background:var(--warnbg);border-radius:14px}
.teachbox input{width:auto;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
/* pagina „Din examenele anterioare” */
.pmeta{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pfilters{gap:10px 16px}.pfilters select{padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.ptext img{max-width:100%;height:auto;vertical-align:middle}.ptext math{font-size:1.08em}
@media print{.past-noprint,.top,.lic,.teachbar{display:none!important}.board,.paper{background:#fff!important;backdrop-filter:none!important}.prob{break-inside:avoid;box-shadow:none}}
.pkey{margin:0 0 4px;padding-left:28px;columns:2;font-size:.92rem}.pkey li{break-inside:avoid;margin:2px 0}details.key summary{cursor:pointer}

  registerItem({ n: 1, families: fam, theory: {"ro": "<h3>1. Ordinea operațiilor</h3><p>Se calculează în ordine: <b>parantezele</b> → <b>puterile</b> → <b>înmulțirile și împărțirile</b> (de la stânga la dreapta) → <b>adunările și scăderile</b>.</p>\n<h3>2. Numere întregi — semne</h3><ul><li>(+)•(+) = +, (−)•(−) = +, (+)•(−) = −, (−)•(+) = −. La fel la împărțire.</li><li>Adunare: semne la fel → aduni și păstrezi semnul: −3 − 5 = −8. Semne diferite → scazi și pui semnul numărului mai mare ca modul: −9 + 4 = −5.</li><li>A scădea = a aduna opusul: 4 − (−3) = 4 + 3 = 7.</li></ul>\n<h3>3. Fracții</h3><ul><li><b>Simplificare:</b> împarți numărătorul și numitorul la același număr: 12/18 = 2/3.</li><li><b>Adunare/scădere:</b> aduci la același numitor: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</li><li><b>Înmulțire:</b> numărător • numărător, numitor • numitor: 2/3 • 9/4 = 18/12 = 3/2.</li><li><b>Împărțire:</b> înmulțești cu inversa: x : (p/q) = x • (q/p). Ex.: 6 : 3/4 = 6 • 4/3 = 8.</li><li>Un număr întreg se scrie ca fracție cu numitorul 1: 5 = 5/1.</li></ul>\n<h3>4. Zecimale și fracții</h3><div class=\"box\">0,5 = 1/2 &nbsp; 0,25 = 1/4 &nbsp; 0,75 = 3/4 &nbsp; 0,2 = 1/5 &nbsp; 0,125 = 1/8 &nbsp; 1,5 = 3/2</div>\n<h3>5. Puteri</h3><ul><li>a<sup>n</sup> = a • a • … • a (de n ori); a<sup>1</sup> = a; a<sup>0</sup> = 1 (a ≠ 0).</li><li>(−2)<sup>2</sup> = 4, dar −2<sup>2</sup> = −4. Puterea pară a unui număr negativ este pozitivă, cea impară este negativă: (−2)<sup>3</sup> = −8.</li></ul>\n<h3>Cum răspunzi la itemul 1</h3><div class=\"ex\">Calculezi separat a și b, apoi operația cerută (a • b, a : b, b − a etc.) și scrii <b>trei</b> numere în casete.</div>", "ru": "<h3>1. Порядок действий</h3><p>Сначала <b>скобки</b> → <b>степени</b> → <b>умножение и деление</b> (слева направо) → <b>сложение и вычитание</b>.</p>\n<h3>2. Целые числа — знаки</h3><ul><li>(+)•(+) = +, (−)•(−) = +, (+)•(−) = −, (−)•(+) = −. Так же при делении.</li><li>Сложение: одинаковые знаки → складываешь и оставляешь знак: −3 − 5 = −8. Разные знаки → вычитаешь и ставишь знак числа с большим модулем: −9 + 4 = −5.</li><li>Вычесть = прибавить противоположное: 4 − (−3) = 4 + 3 = 7.</li></ul>\n<h3>3. Дроби</h3><ul><li><b>Сокращение:</b> числитель и знаменатель делим на одно число: 12/18 = 2/3.</li><li><b>Сложение/вычитание:</b> общий знаменатель: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</li><li><b>Умножение:</b> числитель на числитель, знаменатель на знаменатель: 2/3 • 9/4 = 18/12 = 3/2.</li><li><b>Деление:</b> умножаем на обратную: x : (p/q) = x • (q/p). Напр.: 6 : 3/4 = 6 • 4/3 = 8.</li><li>Целое число — дробь со знаменателем 1: 5 = 5/1.</li></ul>\n<h3>4. Десятичные дроби и обыкновенные</h3><div class=\"box\">0,5 = 1/2 &nbsp; 0,25 = 1/4 &nbsp; 0,75 = 3/4 &nbsp; 0,2 = 1/5 &nbsp; 0,125 = 1/8 &nbsp; 1,5 = 3/2</div>\n<h3>5. Степени</h3><ul><li>a<sup>n</sup> = a • a • … • a (n раз); a<sup>1</sup> = a; a<sup>0</sup> = 1 (a ≠ 0).</li><li>(−2)<sup>2</sup> = 4, но −2<sup>2</sup> = −4. Чётная степень отрицательного числа положительна, нечётная — отрицательна: (−2)<sup>3</sup> = −8.</li></ul>\n<h3>Как отвечать в задании 1</h3><div class=\"ex\">Вычисли отдельно a и b, затем нужное действие (a • b, a : b, b − a и т. д.) и впиши <b>три</b> числа в поля.</div>", "en": "<h3>1. Order of operations</h3><p>First <b>brackets</b> → <b>powers</b> → <b>multiplication and division</b> (left to right) → <b>addition and subtraction</b>.</p>\n<h3>2. Integers — signs</h3><ul><li>(+)•(+) = +, (−)•(−) = +, (+)•(−) = −, (−)•(+) = −. Same for division.</li><li>Addition: same signs → add and keep the sign: −3 − 5 = −8. Different signs → subtract and take the sign of the larger absolute value: −9 + 4 = −5.</li><li>Subtracting = adding the opposite: 4 − (−3) = 4 + 3 = 7.</li></ul>\n<h3>3. Fractions</h3><ul><li><b>Simplify:</b> divide numerator and denominator by the same number: 12/18 = 2/3.</li><li><b>Add/subtract:</b> common denominator: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</li><li><b>Multiply:</b> numerators together, denominators together: 2/3 • 9/4 = 18/12 = 3/2.</li><li><b>Divide:</b> multiply by the reciprocal: x : (p/q) = x • (q/p). E.g. 6 : 3/4 = 6 • 4/3 = 8.</li><li>An integer is a fraction with denominator 1: 5 = 5/1.</li></ul>\n<h3>4. Decimals and fractions</h3><div class=\"box\">0,5 = 1/2 &nbsp; 0,25 = 1/4 &nbsp; 0,75 = 3/4 &nbsp; 0,2 = 1/5 &nbsp; 0,125 = 1/8 &nbsp; 1,5 = 3/2</div>\n<h3>5. Powers</h3><ul><li>a<sup>n</sup> = a • a • … • a (n times); a<sup>1</sup> = a; a<sup>0</sup> = 1 (a ≠ 0).</li><li>(−2)<sup>2</sup> = 4, but −2<sup>2</sup> = −4. An even power of a negative number is positive, an odd one is negative: (−2)<sup>3</sup> = −8.</li></ul>\n<h3>How to answer item 1</h3><div class=\"ex\">Work out a and b separately, then the required operation (a • b, a : b, b − a, …) and write <b>three</b> numbers in the boxes.</div>"}, example: {

  registerItem({ n: 2, families: fam, theory: {"ro": "<h3>1. Unghiuri</h3><ul><li><b>Suplementare:</b> suma = 180°. <b>Complementare:</b> suma = 90°.</li><li><b>Opuse la vârf</b> sunt congruente.</li><li><b>Drepte paralele a ∥ b tăiate de o secantă:</b> unghiurile corespondente sunt egale; alterne interne egale; alterne externe egale; interne de aceeași parte au suma 180°.</li></ul>\n<h3>2. Triunghiul</h3><ul><li>Suma unghiurilor = 180°.</li><li><b>Unghi exterior</b> = suma celor două unghiuri interioare neadiacente lui.</li><li><b>Isoscel:</b> unghiurile de la bază sunt egale. <b>Echilateral:</b> toate unghiurile 60°, toate laturile egale; P = 3l.</li><li><b>Înălțimea</b> formează unghi de 90° cu latura; în triunghiul isoscel, înălțimea din vârf este și mediană și bisectoare.</li></ul>\n<h3>3. Paralelogramul</h3><div class=\"box\">Laturile opuse sunt paralele și egale; unghiurile opuse sunt egale; unghiurile alăturate au suma 180°.</div>\n<h3>4. Linia mijlocie</h3><ul><li><b>În triunghi</b> (unește mijloacele a două laturi): este paralelă cu a treia latură și are jumătate din lungimea ei: MN = BC : 2.</li><li><b>În trapez</b> (unește mijloacele laturilor neparalele): este paralelă cu bazele și MN = (B + b) : 2.</li></ul>\n<h3>5. Cercul</h3><ul><li><b>Unghi la centru</b> = măsura arcului cuprins. <b>Unghi înscris</b> = jumătate din arcul cuprins.</li><li>Un cerc împărțit în n arce congruente: fiecare arc are 360° : n.</li><li><b>Tangenta</b> este perpendiculară pe raza dusă în punctul de tangență (90°).</li><li><b>Lungimea cercului</b> L = 2πr; <b>aria discului</b> A = πr²; diametrul d = 2r.</li><li>Poziția unei drepte față de cerc: distanța d de la centru la dreaptă: d &lt; r secantă; d = r tangentă; d &gt; r exterioară.</li></ul>\n<h3>Cum răspunzi la itemul 2</h3><div class=\"ex\">Citește datele din desen, alege regula potrivită, calculează și scrie în casetă valoarea cerută (cm, grade sau expresie cu π).</div>", "ru": "<h3>1. Углы</h3><ul><li><b>Смежные:</b> сумма = 180°. <b>Дополнительные до 90°:</b> сумма = 90°.</li><li><b>Вертикальные</b> углы равны.</li><li><b>Параллельные a ∥ b и секущая:</b> соответственные углы равны; накрест лежащие равны; односторонние в сумме 180°.</li></ul>\n<h3>2. Треугольник</h3><ul><li>Сумма углов = 180°.</li><li><b>Внешний угол</b> = сумма двух внутренних, не смежных с ним.</li><li><b>Равнобедренный:</b> углы при основании равны. <b>Равносторонний:</b> все углы по 60°, стороны равны; P = 3a.</li><li><b>Высота</b> образует со стороной угол 90°; в равнобедренном треугольнике высота к основанию — также медиана и биссектриса.</li></ul>\n<h3>3. Параллелограмм</h3><div class=\"box\">Противоположные стороны параллельны и равны; противоположные углы равны; соседние углы в сумме 180°.</div>\n<h3>4. Средняя линия</h3><ul><li><b>В треугольнике</b> (соединяет середины двух сторон): параллельна третьей стороне и равна её половине: MN = BC : 2.</li><li><b>В трапеции</b> (соединяет середины боковых сторон): параллельна основаниям, MN = (B + b) : 2.</li></ul>\n<h3>5. Окружность</h3><ul><li><b>Центральный угол</b> = дуге, на которую опирается. <b>Вписанный угол</b> = половине дуги.</li><li>Окружность, разделённая на n равных дуг: каждая дуга 360° : n.</li><li><b>Касательная</b> перпендикулярна радиусу в точке касания (90°).</li><li><b>Длина окружности</b> L = 2πr; <b>площадь круга</b> A = πr²; диаметр d = 2r.</li><li>Прямая и окружность: расстояние d от центра до прямой: d &lt; r — секущая; d = r — касательная; d &gt; r — не пересекает.</li></ul>\n<h3>Как отвечать в задании 2</h3><div class=\"ex\">Считай данные с чертежа, выбери нужное правило, вычисли и впиши в поле значение (см, градусы или выражение с π).</div>", "en": "<h3>1. Angles</h3><ul><li><b>Supplementary:</b> sum = 180°. <b>Complementary:</b> sum = 90°.</li><li><b>Vertical angles</b> are equal.</li><li><b>Parallel lines a ∥ b cut by a transversal:</b> corresponding angles are equal; alternate interior angles are equal; co-interior angles add up to 180°.</li></ul>\n<h3>2. Triangle</h3><ul><li>Angle sum = 180°.</li><li><b>Exterior angle</b> = sum of the two non-adjacent interior angles.</li><li><b>Isosceles:</b> base angles are equal. <b>Equilateral:</b> all angles 60°, all sides equal; P = 3a.</li><li>An <b>altitude</b> makes a 90° angle with the side; in an isosceles triangle the altitude to the base is also a median and angle bisector.</li></ul>\n<h3>3. Parallelogram</h3><div class=\"box\">Opposite sides are parallel and equal; opposite angles are equal; adjacent angles add up to 180°.</div>\n<h3>4. Midline</h3><ul><li><b>In a triangle</b> (joins midpoints of two sides): parallel to the third side and half as long: MN = BC : 2.</li><li><b>In a trapezoid</b> (joins midpoints of the legs): parallel to the bases, MN = (B + b) : 2.</li></ul>\n<h3>5. Circle</h3><ul><li><b>Central angle</b> = its arc. <b>Inscribed angle</b> = half its arc.</li><li>A circle split into n equal arcs: each arc is 360° : n.</li><li>A <b>tangent</b> is perpendicular to the radius at the point of tangency (90°).</li><li><b>Circumference</b> L = 2πr; <b>area</b> A = πr²; diameter d = 2r.</li><li>Line vs circle: distance d from the centre to the line: d &lt; r secant; d = r tangent; d &gt; r no intersection.</li></ul>\n<h3>How to answer item 2</h3><div class=\"ex\">Read the data from the figure, pick the right rule, calculate and write the requested value (cm, degrees or an expression with π) in the box.</div>"}, example: {

function fieldHTML(p, i, j, o) {
  const f = p.fields[j]; const v = (o.vals[i] || [])[j] || ''; const res = o.res && o.res[i] && o.res[i].fields[j];
  const cls = res ? (res.ok ? 'ok' : 'bad') : '';
  const mark = res ? `<span class="mark ${res.ok ? 'ok' : 'bad'}">${res.ok ? '✓' : '✗'}</span>` : '';
  const label = lbl(f.label);
  if (f.type === 'choice') {
    return `<span class="fld"><span class="flab">${label}</span><span class="opts">${f.opts.map(op => `<button type="button" class="opt ${v === op.v ? 'on' : ''} ${res && v === op.v ? (res.ok ? 'ok' : 'bad') : ''}" data-act="opt" data-p="${i}" data-f="${j}" data-v="${op.v}" ${o.locked ? 'disabled' : ''}>${op.h[S.lang]}</button>`).join('')}</span>${mark}</span>`;
  }
  return `<label class="fld"><span class="flab">${label}</span><input class="ans ${cls}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-p="${i}" data-f="${j}" value="${String(v).replace(/"/g, '&quot;')}" ${o.locked ? 'readonly' : ''} placeholder="?"><span class="unit">${unitOf(f.unit)}</span>${mark}</label>`;
}
function probHTML(p, i, o) {
  const res = o.res && o.res[i];
  const cls = res && o.locked ? (res.all ? 'okp' : 'badp') : '';
  let extra = '';
  if (o.reveal) extra += `<div class="fb ${res && res.all ? 'good' : ''}">${res && res.all ? '' : `${tx('correctAns')}: `}${res && res.all ? '' : ansHTML(p)}</div>`;
  if (o.showSol) extra += `<div class="sol"><b>${tx('solution')}:</b><br>${p.sol(S.lang)}</div>`;
  if (o.hint) extra += `<div class="hintbox">💡 ${p.hint ? p.hint(S.lang) : ''}</div>`;
  if (S.teacher && !o.reveal) extra += `<div class="key"><b>${tx('tAnswer')}:</b> ${ansHTML(p)}</div>`;
  return `<div class="prob ${cls}"><div class="pnum">${o.num != null ? o.num : i + 1}</div><div class="pbody"><div class="ptext">${p.text(S.lang)}</div>${p.fig ? `<div class="pfig">${p.fig}</div>` : ''}<div class="pfields">${p.fields.map((f, j) => fieldHTML(p, i, j, o)).join('')}</div>${o.note || ''}${extra}</div></div>`;
}

function pexHTML(p, num, pts) {

}

  let pg = newPage(), cols = $('.cols', pg);
  const addEl = html => { const d = document.createElement('div'); d.innerHTML = html; const el = d.firstElementChild; cols.appendChild(el); return el; };
  for (let i = 0; i < o.main.length; i++) {
    let el = addEl(o.main[i].html);
    if (overflowing(cols)) { cols.removeChild(el); if (cols.children.length === 0) { cols.appendChild(el); continue; } pg = newPage(); cols = $('.cols', pg); el = addEl(o.main[i].html); }
  }
  if (o.extra) {
    let divEl = o.divider ? addEl(o.divider) : null;
    if (divEl && overflowing(cols)) { cols.removeChild(divEl); divEl = null; o.extra = null; }
    let guard = 0;
    while (o.extra && guard++ < 80) {
      const nx = o.extra(); if (!nx) break; const el = addEl(nx.html);
      if (overflowing(cols)) { cols.removeChild(el); o.rollback && o.rollback(); break; }
    }
    if (divEl && cols.lastElementChild === divEl) cols.removeChild(divEl);
  }
  pages.forEach(p => { const c = $('.cols', p); let g = 0; while (overflowing(c) && c.children.length > 1 && g++ < 5) { c.removeChild(c.lastElementChild); o.rollback && o.extra && o.rollback(); } });

}
const scoreLine = max => `<div class="t2 scoreln"><span>${tx('maxPts')}: <b>${Math.round(max * 100) / 100} ${tx('pts')}</b></span><span>${tx('gotPts')}: ______ / ${Math.round(max * 100) / 100} &nbsp; ${tx('grade')}: ______</span></div>`;
function buildSheets(sheets, o) {

    background: #f8fafc;
  }
  #matetutor-iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  @media (max-width: 480px) {
    #matetutor-window {
      width: calc(100vw - 24px);
      right: 12px;
      height: calc(100vh - 110px);
    }
  }
</style>

<script>
  function toggleMateTutor() {
    var w = document.getElementById('matetutor-window');
    var b = document.getElementById('matetutor-btn');
    var f = document.getElementById('matetutor-iframe');
    var isOpen = (w.style.display !== 'none' && w.style.display !== '');
    if (isOpen) {
      w.style.display = 'none';
      b.style.display = 'flex';
    } else {
      // Încarcă iframe-ul abia la prima deschidere (evită fereastra goală)
      if (!f.src) { f.src = f.getAttribute('data-src'); }
      w.style.display = 'flex';
      b.style.display = 'none';
    }
  }
</script>

<style>@media print{#matetutor-launcher{display:none!important}}body:has(#pdfOverlay:not([hidden])) #matetutor-launcher{display:none!important}</style>
</body></html>
